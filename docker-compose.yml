services:
  web:
    build: .
    container_name: securebank_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:securepass123@db:5432/securebank
      - SECRET_KEY=super_secret_key_change_in_production
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: securebank_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepass123
      - POSTGRES_DB=securebank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securebank"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

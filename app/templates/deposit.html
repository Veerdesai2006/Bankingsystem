{% extends "base.html" %}
{% block title %}Deposit — SecureBank{% endblock %}

{% block content %}
<div class="banking-page">
  <div class="container">
    <div class="banking-card">

      <div class="page-header anim anim-1">
        <div class="page-eyebrow">Banking</div>
        <h1 class="page-title">Deposit Money</h1>
        <p class="mt-1">Add funds to your SecureBank account instantly.</p>
      </div>

      <!-- Alert -->
      <div class="alert" id="deposit-alert" role="alert"></div>

      <!-- Deposit Form -->
      <div class="card anim anim-2">
        <form id="deposit-form" onsubmit="handleDeposit(event)" novalidate>

          <div class="form-group">
            <label class="form-label" for="amount">Deposit Amount (₹)</label>
            <div class="input-with-prefix">
              <span class="input-prefix">₹</span>
              <input
                type="number"
                id="amount"
                name="amount"
                class="form-input"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Description (optional)</label>
            <input
              type="text"
              id="description"
              name="description"
              class="form-input"
              placeholder="e.g. Salary, ATM deposit"
              maxlength="255"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="deposit-btn">
            ⬇️ &nbsp;Confirm Deposit
          </button>

        </form>
      </div>

      <!-- Success Result (hidden until deposit succeeds) -->
      <div class="result-card anim anim-3" id="result-card">
        <div class="result-label">New Balance</div>
        <div class="result-value" id="result-balance">₹0.00</div>
      </div>

      <!-- Navigation -->
      <div style="text-align:center; margin-top:1.5rem;" class="anim anim-4">
        <a href="/dashboard" id="deposit-back">← Back to Dashboard</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
